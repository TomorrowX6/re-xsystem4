name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI_NAMES: arm64-v8a
      ANDROID_API_LEVEL: 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison flex autoconf automake libtool pkg-config

      - name: Build Native Libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sed -i 's/\r$//' ./build-shared-libs.sh ./collect-licenses.sh
          chmod +x ./build-shared-libs.sh ./collect-licenses.sh
          ./build-shared-libs.sh

      - name: Build Signed APK
        run: |
          cd project
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > keystore.jks
          else
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=re-xsystem4,O=Android,C=CN"
          fi
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../re-xsystem4-arm64-v8a.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-xsystem4-arm64-v8a
          path: re-xsystem4-arm64-v8a.apk
          if-no-files-found: error
