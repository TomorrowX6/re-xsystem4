name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI_NAMES: arm64-v8a
      ANDROID_API_LEVEL: 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            SDK_NINJA=$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/cmake/*/bin/ninja 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$SDK_NINJA" ]; then
              echo "$(dirname "$SDK_NINJA")" >> "$GITHUB_PATH"
              export PATH="$(dirname "$SDK_NINJA"):$PATH"
            fi
          fi
          MISSING=""
          for cmd in ninja:ninja-build bison:bison flex:flex autoconf:autoconf automake:automake libtoolize:libtool pkg-config:pkg-config; do
            bin="${cmd%%:*}"
            pkg="${cmd##*:}"
            command -v "$bin" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            fi
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            sudo apt-get update
            sudo apt-get install -y $MISSING
          fi

      - name: Build Native Libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sed -i 's/\r$//' ./build-shared-libs.sh ./collect-licenses.sh
          chmod +x ./build-shared-libs.sh ./collect-licenses.sh
          ./build-shared-libs.sh

      - name: Build Signed APK
        run: |
          cd project
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > keystore.jks
          else
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=re-xsystem4,O=Android,C=CN"
          fi
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../re-xsystem4-arm64-v8a.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-xsystem4-arm64-v8a
          path: re-xsystem4-arm64-v8a.apk
          if-no-files-found: error
